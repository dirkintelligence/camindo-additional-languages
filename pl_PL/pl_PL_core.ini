proc.ffmpegimage.tooltip_field_format = "JPEG to typowy wybór dla obrazów podglądu filmów.<br>PNG jest bezstratny, a przez to znacznie większy.<br>WebP daje najmniejsze pliki przy tej samej jakości, ale nie jest wyświetlany przez bardzo stare przeglądarki.<br>Format powinien pasować do rozszerzenia pliku wersji."
proc.ffmpegimage.tooltip_field_quality = "100 = najlepsza jakość, 0 = najgorsza.<br>Typowe wartości: od 70 do 85.<br>Przy PNG obraz jest zawsze bezstratny, wartość określa tylko stopień kompresji."
proc.ffmpegimage.tooltip_field_frame_mode = "„Stała pozycja” zawsze pobiera klatkę w tym samym miejscu.<br>„Udział w długości” dostosowuje się do długości filmu i dzięki temu przy krótkich filmach nie wychodzi poza koniec.<br>„Wybierz automatycznie” pozwala ffmpeg wybrać najbardziej reprezentatywną z kilku klatek i omija w ten sposób czarne klatki początkowe."
proc.ffmpegimage.tooltip_field_frame_time = "Pozycja w filmie, np. 5 lub 00:00:05.<br>W trybie automatycznego wyboru wyszukiwanie zaczyna się od tej pozycji. Puste = na początku.<br>Jeśli wartość wykracza poza koniec filmu, pobierana jest ostatnia klatka."
proc.ffmpegimage.tooltip_field_frame_percent = "Udział w całkowitej długości, np. 10% dwuminutowego filmu = 12. sekunda.<br>Uwzględniane tylko w trybie udziału w długości."
proc.ffmpegimage.tooltip_field_scan_frames = "Liczba klatek, spośród których wybierany jest obraz podglądu. Więcej klatek to lepszy wybór i dłuższy czas przetwarzania.<br>Uwzględniane tylko w trybie automatycznego wyboru."
proc.ffmpegimage.tooltip_field_crop = "Przyciąć obraz, aby wypełnił nowe wymiary, czy zmieścić w nich cały obraz?"
proc.ffmpegimage.tooltip_field_prevent_upscaling = "Jeśli film jest mniejszy niż wymiary docelowe, nie jest powiększany. Powiększanie kosztuje tylko czas przetwarzania i rozmiar pliku, nie dodając szczegółów."
proc.ffmpegimage.tooltip_field_deinterlace = "Materiał z przeplotem (np. z emisji telewizyjnej) pokazuje w przeciwnym razie efekt grzebienia przy ruchu, szczególnie widoczny na nieruchomej klatce.<br>„Automatycznie” stosuje filtr tylko do klatek, których to faktycznie dotyczy."
proc.ffmpegimage.tooltip_field_auto_rotation = "Pionowe filmy z telefonów są fizycznie zapisywane poziomo, a obrót przechowują w metadanych. Gdy ta opcja jest wyłączona, obraz pozostaje obrócony na bok."
proc.ffmpegimage.tooltip_field_sharpen = "Silne pomniejszenie powoduje utratę ostrości krawędzi. Umiarkowane wyostrzenie przywraca ostrość obrazu podglądu bez widocznych obwódek."
proc.ffmpegimage.tooltip_field_strip_meta = "Usuwa wszystkie metadane z pliku docelowego, w szczególności dane o lokalizacji i nazwę urządzenia z nagrań telefonów."
proc.ffmpegimage.tooltip_field_threads = "Liczba rdzeni, których może używać ffmpeg. Pozostaw puste, aby decydował ffmpeg. Na serwerach współdzielonych zalecany jest limit."
proc.ffmpegimage.tooltip_field_background_process = "Zalecane, jeśli obrazy podglądu powstają z filmów, które same są renderowane w tle: zadanie cron (trigger_ff.php) uruchamia ten konwerter, gdy tylko film jest dostępny, a następnie śledzi postęp.<br>Bez tego ustawienia wywołanie czeka, aż obraz będzie gotowy. Przy już dostępnym źródle trwa to tylko kilka sekund."
proc.ffmpegimage.tooltip_field_max_time_out = "Konwersja jest przerywana po tym czasie. Zapobiega bezterminowemu zajmowaniu czasu przetwarzania przez uszkodzony plik."
proc.ffmpegimage.tooltip_field_parameter1 = "Opcje wejściowe umieszczane przed plikiem źródłowym,<br>np. -hwaccel auto"
proc.ffmpegimage.tooltip_field_parameter2 = "Własne opcje wyjściowe, np. -vf \"hue=s=0\".<br>Jeśli podano tu opcję zastępującą jedno z pól powyżej (np. -vf lub -q:v), wygrywa własna wartość, a odpowiednie pole jest ignorowane."
