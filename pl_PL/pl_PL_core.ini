proc.ffmpegaudio.note_parameter2 = "Parametry po pliku źródłowym (opcje wyjściowe)"
proc.ffmpegaudio.tooltip_field_container = "Kontener określa, które kodeki są dozwolone:<br>MP3 tylko z MP3,<br>M4A tylko z AAC,<br>Ogg z Vorbis, Opus lub FLAC,<br>Opus tylko z Opus,<br>FLAC i WAV są bezstratne.<br>MP3 odtwarza się wszędzie, M4A i Opus brzmią wyraźnie lepiej przy tym samym rozmiarze pliku."
proc.ffmpegaudio.tooltip_field_codec = "„Zgodnie z kontenerem” wybiera standardowy kodek wybranego kontenera. Kodek niepasujący do kontenera jest przy zapisie przywracany do tego standardu.<br>„Kopiuj” przejmuje strumień audio bez zmian: bardzo szybko, ale jakość, częstotliwość próbkowania, kanały, głośność i wyciszenia nie mają wtedy wpływu."
proc.ffmpegaudio.tooltip_field_quality_mode = "VBR utrzymuje stałą jakość, a rozmiar pliku się dostosowuje.<br>Przepływność utrzymuje stały rozmiar, a jakość się dostosowuje. Do internetu VBR jest zwykle lepszym wyborem."
proc.ffmpegaudio.tooltip_field_quality = "0 = najlepsza jakość, 9 = najmniejszy plik. Typowe wartości: od 2 do 5, domyślnie 4 (ok. 160 kbit/s przy MP3).<br>Każdy koder ma własną skalę, a poziom jest przeliczany automatycznie: MP3 i Vorbis mają prawdziwe poziomy jakości, AAC i Opus otrzymują odpowiednią docelową przepływność.<br>Przy FLAC poziom określa stopień kompresji danych, jakość pozostaje bezstratna."
proc.ffmpegaudio.tooltip_field_bitrate = "Docelowa przepływność w kbit/s, np. 128 dla muzyki stereo, 96 dla mowy, 64 dla mono.<br>Uwzględniana tylko w trybie przepływności, bez wpływu przy FLAC i PCM."
proc.ffmpegaudio.tooltip_field_sample_rate = "Częstotliwość próbkowania pliku docelowego. 44,1 kHz to częstotliwość płyty audio CD, 48 kHz – wideo i emisji. Dla samej mowy wystarczy 22,05 lub 16 kHz, co oszczędza dużo miejsca.<br>Opus wewnętrznie zawsze działa z 48 kHz."
proc.ffmpegaudio.tooltip_field_audio_channels = "Zmiksowanie dźwięku wielokanałowego lub stereo do mono prawie o połowę zmniejsza rozmiar pliku nagrań mowy."
proc.ffmpegaudio.tooltip_field_normalisation = "Wyrównuje głośność zgodnie z EBU R128, aby nagrania o różnej głośności były odtwarzane równie głośno.<br>-23 LUFS to standard emisyjny, -16 LUFS jest typowe w internecie i dla podcastów.<br>Pomiar i korekta odbywają się w jednym przebiegu: nieco mniej dokładnie niż w dwóch, ale bez dodatkowego czasu przetwarzania."
proc.ffmpegaudio.tooltip_field_gain = "Podnosi lub obniża poziom o podaną wartość w decybelach. W połączeniu z normalizacją wartość działa jako przesunięcie względem jej celu.<br>Uwaga: podniesienie poziomu może spowodować przesterowanie."
proc.ffmpegaudio.tooltip_field_start_time = "Konwersja zaczyna się od tej pozycji, np. 5 lub 00:00:05"
proc.ffmpegaudio.tooltip_field_duration = "Długość fragmentu od czasu początkowego, np. 30 dla półminutowej zapowiedzi. Puste = do końca."
proc.ffmpegaudio.tooltip_field_fade_in = "Stopniowo podgłaśnia początek przez podany czas w sekundach, np. 2 lub 1,5. Łagodzi gwałtowne początki."
proc.ffmpegaudio.tooltip_field_fade_out = "Stopniowo wycisza koniec przez podany czas w sekundach. Punkt początkowy jest obliczany z długości pliku docelowego i uwzględnia więc czas początkowy i długość.<br>Jeśli długość źródła jest nieznana, nic nie jest wyciszane."
proc.ffmpegaudio.tooltip_field_strip_meta = "Usuwa wszystkie metadane z pliku docelowego, łącznie z tytułem, wykonawcą i albumem. Przy audio zwykle niepożądane, ale przydatne np. przy nagraniach głosowych z nazwą urządzenia i lokalizacją."
proc.ffmpegaudio.tooltip_field_keep_cover = "Zachowuje okładkę osadzoną w pliku źródłowym. Działa tylko przy MP3, M4A i FLAC.<br>Jeśli źródło zawiera zamiast okładki prawdziwy strumień wideo, jest on zawsze odrzucany: dźwięk pozostaje."
proc.ffmpegaudio.tooltip_field_threads = "Liczba rdzeni, których może używać ffmpeg. Pozostaw puste, aby decydował ffmpeg. Większość koderów audio i tak działa na jednym rdzeniu."
proc.ffmpegaudio.tooltip_field_background_process = "Przy audio zwykle niepotrzebne. Przy bardzo długich nagraniach (kazania, koncerty, audiobooki) tryb w tle zapobiega przekroczeniu przez żądanie limitu czasu PHP lub serwera WWW.<br>Postęp jest śledzony przez zadanie cron (trigger_bg.php)."
proc.ffmpegaudio.tooltip_field_max_time_out = "Konwersja jest przerywana po tym czasie. Zapobiega bezterminowemu zajmowaniu czasu przetwarzania przez uszkodzony plik."
proc.ffmpegaudio.tooltip_field_parameter1 = "Opcje wejściowe umieszczane przed plikiem źródłowym,<br>np. -guess_layout_max 0"
proc.ffmpegaudio.tooltip_field_parameter2 = "Własne opcje wyjściowe, np. -cutoff 18000.<br>Jeśli podano tu opcję zastępującą jedno z pól powyżej (np. -b:a lub -af), wygrywa własna wartość, a odpowiednie pole jest ignorowane. Wszystkie pozostałe pola nadal obowiązują."
