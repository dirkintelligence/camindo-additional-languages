proc.ffmpegvideo.tooltip_field_container = "Kontener określa, które kodeki są dozwolone:<br>MP4 z H.264/H.265/AV1 i AAC/MP3,<br>WebM tylko z VP9/AV1 i Opus,<br>Matroska z dowolną kombinacją."
proc.ffmpegvideo.tooltip_field_codec = "H.264 odtwarza się wszędzie.<br>H.265 i AV1 dają mniejsze pliki, ale wymagają więcej czasu przetwarzania i nie są obsługiwane przez każde urządzenie.<br>„Kopiuj” przejmuje strumień wideo bez zmian: bardzo szybko, ale wymiary, jakość i filtry nie mają wtedy wpływu."
proc.ffmpegvideo.tooltip_field_crop = "Przyciąć film, aby wypełnił nowe wymiary, czy zmieścić w nich cały obraz?"
proc.ffmpegvideo.tooltip_field_prevent_upscaling = "Jeśli źródło jest mniejsze niż wymiary docelowe, nie jest powiększane. Powiększanie kosztuje tylko czas przetwarzania i rozmiar pliku, nie dodając szczegółów."
proc.ffmpegvideo.tooltip_field_quality_mode = "CRF utrzymuje stałą jakość, a rozmiar pliku się dostosowuje.<br>Przepływność utrzymuje stały rozmiar, a jakość się dostosowuje. Do internetu CRF jest zwykle lepszym wyborem."
proc.ffmpegvideo.tooltip_field_quality = "0 = bezstratnie, 51 = najgorsza jakość.<br>Typowe wartości: od 18 do 28, domyślnie 23.<br>VP9 i AV1 używają zakresu od 0 do 63, wyższe wartości są ograniczane."
proc.ffmpegvideo.tooltip_field_bitrate = "Docelowa przepływność w kbit/s, np. 2500 dla 720p.<br>Uwzględniana tylko w trybie przepływności."
proc.ffmpegvideo.tooltip_field_preset = "Kompromis między czasem przetwarzania a rozmiarem pliku. Wolniej oznacza mniejszy plik przy tej samej jakości. Nazwy są automatycznie przeliczane na skale używane przez VP9 i AV1."
proc.ffmpegvideo.tooltip_field_max_fps = "Górny limit liczby klatek na sekundę. Jeśli źródło jest wolniejsze, pozostaje bez zmian: klatki nigdy nie są dorabiane."
proc.ffmpegvideo.tooltip_field_start_time = "Konwersja zaczyna się od tej pozycji, np. 5 lub 00:00:05"
proc.ffmpegvideo.tooltip_field_duration = "Długość fragmentu od czasu początkowego, np. 10 dla dziesięciosekundowej zapowiedzi. Puste = do końca."
proc.ffmpegvideo.tooltip_field_faststart = "Przenosi indeks na początek pliku, aby film mógł zacząć się odtwarzać przed pełnym załadowaniem. Działa tylko przy MP4."
proc.ffmpegvideo.tooltip_field_compatible_pix_mode = "Wymusza yuv420p. Bez tego źródła 10-bitowe lub 4:4:4 dają pliki, których wiele przeglądarek i telewizorów nie potrafi odtworzyć."
proc.ffmpegvideo.tooltip_field_deinterlace = "Materiał z przeplotem (np. z emisji telewizyjnej) pokazuje w przeciwnym razie efekt grzebienia przy ruchu.<br>„Automatycznie” stosuje filtr tylko do klatek, których to faktycznie dotyczy."
proc.ffmpegvideo.tooltip_field_auto_rotation = "Pionowe filmy z telefonów są fizycznie zapisywane poziomo, a obrót przechowują w metadanych. Gdy ta opcja jest wyłączona, obraz pozostaje obrócony na bok."
proc.ffmpegvideo.tooltip_field_strip_meta = "Usuwa wszystkie metadane z pliku docelowego, w szczególności dane o lokalizacji i nazwę urządzenia z nagrań telefonów."
proc.ffmpegvideo.tooltip_field_audio_codec = "AAC pasuje do MP4, Opus do WebM.<br>„Kopiuj” przejmuje strumień audio bez zmian, więc przepływność, kanały i normalizacja nie mają wpływu."
proc.ffmpegvideo.tooltip_field_audio_bitrate = "Typowe wartości: 128 dla stereo, 96 dla mowy, 64 dla mono."
proc.ffmpegvideo.tooltip_field_audio_channels = "Zmiksowanie dźwięku wielokanałowego do stereo lub mono oszczędza przepływność."
proc.ffmpegvideo.tooltip_field_audio_normalisation = "Wyrównuje głośność do -23 LUFS zgodnie z EBU R128, aby filmy o różnej głośności były odtwarzane równie głośno. Wymaga dodatkowego czasu przetwarzania."
proc.ffmpegvideo.tooltip_field_threads = "Liczba rdzeni, których może używać ffmpeg. Pozostaw puste, aby decydował ffmpeg. Na serwerach współdzielonych zalecany jest limit."
proc.ffmpegvideo.tooltip_field_background_process = "Zalecane. W przeciwnym razie żądanie czeka, aż konwersja się zakończy, i przy dłuższych filmach przekracza limit czasu PHP lub serwera WWW.<br>Postęp jest śledzony przez zadanie cron (trigger_bg.php)."
proc.ffmpegvideo.tooltip_field_max_time_out = "Konwersja jest przerywana po tym czasie. Zapobiega bezterminowemu zajmowaniu czasu przetwarzania przez uszkodzony plik."
proc.ffmpegvideo.tooltip_field_parameter1 = "Opcje wejściowe umieszczane przed plikiem źródłowym,<br>np. -hwaccel auto lub -f lavfi"
proc.ffmpegvideo.tooltip_field_parameter2 = "Własne opcje wyjściowe, np. -tune film.<br>Jeśli podano tu opcję zastępującą jedno z pól powyżej (np. -crf lub -vf), wygrywa własna wartość, a odpowiednie pole jest ignorowane."
