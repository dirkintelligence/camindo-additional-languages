ai.label_effort = "Nakład pracy"
ai.headline_shortcut = "Skrót klawiszowy"
ai.text_shortcut = "otwiera asystenta w panelu bocznym, z dowolnej strony backendu."
ai.text_shortcut_mac = "Na Macu: Command (⌘) + K. Tam, gdzie edytor sam używa tych klawiszy (np. do „Wstaw link”), obowiązuje funkcja edytora."
ai.headline_how = "Jak działa asystent"
ai.text_how = "Asystent widzi dokładnie to, co ty, i może dokładnie to, co ty. Wyszukuje, czyta, tworzy i zmienia za pomocą tych samych funkcji co interfejs użytkownika; każda zmiana pojawia się w dzienniku audytu pod twoim nazwiskiem, oznaczona jako działanie asystenta. Nie zmienia rekordów, które masz właśnie otwarte w formularzu edycji – prosi wtedy najpierw o zamknięcie formularza."
ai.text_how_encrypted = "Wyjątek: asystent nie widzi zawartości pól zaszyfrowanych – otrzymuje tylko symbol zastępczy „[encrypted]”. W tych polach może wyszukiwać tylko wartości występujące dokładnie w podanej postaci, np. adres e-mail, który mu podasz."
ai.headline_disclaimer = "Uwaga"
ai.text_disclaimer = "Asystent to model językowy zewnętrznego dostawcy. To, co piszesz, oraz to, co asystent odczytuje w CMS, jest wysyłane do tego dostawcy. Odpowiedzi mogą być błędne lub niepełne – sprawdzaj wyniki, zanim na nich polegasz, i potwierdzaj tylko zmiany, które rozumiesz."
ai.headline_levels = "Potwierdzenia"
ai.text_levels = "Działania są pogrupowane według wagi. Od poziomu 1 asystent pyta, zanim zacznie działać. Zezwalasz na pojedyncze działanie lub – do końca czatu – na wszystkie działania tego samego poziomu."
