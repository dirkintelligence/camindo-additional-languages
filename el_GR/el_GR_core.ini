proc.ffmpegaudio.note_parameter2 = "Παράμετροι μετά το αρχείο προέλευσης (επιλογές εξόδου)"
proc.ffmpegaudio.tooltip_field_container = "Ο περιέκτης καθορίζει ποιοι κωδικοποιητές επιτρέπονται:<br>MP3 μόνο με MP3,<br>M4A μόνο με AAC,<br>Ogg με Vorbis, Opus ή FLAC,<br>Opus μόνο με Opus,<br>FLAC και WAV είναι χωρίς απώλειες.<br>Το MP3 αναπαράγεται παντού, τα M4A και Opus ακούγονται σαφώς καλύτερα στο ίδιο μέγεθος αρχείου."
proc.ffmpegaudio.tooltip_field_codec = "Το \"Κατάλληλος για τον περιέκτη\" επιλέγει τον τυπικό κωδικοποιητή του επιλεγμένου περιέκτη. Ένας κωδικοποιητής που δεν ταιριάζει στον περιέκτη επαναφέρεται σε αυτόν τον τυπικό κατά την αποθήκευση.<br>Η \"Αντιγραφή\" παίρνει τη ροή ήχου αμετάβλητη: πολύ γρήγορο, αλλά ποιότητα, ρυθμός δειγματοληψίας, κανάλια, ένταση και σβησίματα δεν έχουν τότε καμία επίδραση."
proc.ffmpegaudio.tooltip_field_quality_mode = "Το VBR διατηρεί σταθερή την ποιότητα και αφήνει το μέγεθος αρχείου να προσαρμόζεται.<br>Ο ρυθμός bit διατηρεί σταθερό το μέγεθος και αφήνει την ποιότητα να προσαρμόζεται. Για το web, το VBR είναι συνήθως η καλύτερη επιλογή."
proc.ffmpegaudio.tooltip_field_quality = "0 = καλύτερη ποιότητα, 9 = μικρότερο αρχείο. Συνήθεις τιμές: 2 έως 5, προεπιλογή 4 (περίπου 160 kbit/s με MP3).<br>Κάθε κωδικοποιητής έχει τη δική του κλίμακα και το επίπεδο μεταφράζεται αυτόματα: τα MP3 και Vorbis έχουν πραγματικά επίπεδα ποιότητας, τα AAC και Opus λαμβάνουν κατάλληλο ρυθμό bit προορισμού.<br>Με το FLAC το επίπεδο ελέγχει πόσο συμπιέζονται τα δεδομένα, η ποιότητα παραμένει χωρίς απώλειες."
proc.ffmpegaudio.tooltip_field_bitrate = "Ρυθμός προορισμού σε kbit/s, π.χ. 128 για μουσική σε στερεοφωνικό, 96 για ομιλία, 64 για μονοφωνικό.<br>Αξιολογείται μόνο σε λειτουργία ρυθμού bit και δεν έχει επίδραση για FLAC και PCM."
proc.ffmpegaudio.tooltip_field_sample_rate = "Ρυθμός δειγματοληψίας του αρχείου προορισμού. Τα 44,1 kHz είναι ο ρυθμός του CD ήχου, τα 48 kHz ο ρυθμός που χρησιμοποιείται σε βίντεο και εκπομπές. Μόνο για ομιλία αρκούν 22,05 ή 16 kHz και εξοικονομούν πολύ χώρο.<br>Το Opus λειτουργεί εσωτερικά πάντα στα 48 kHz."
proc.ffmpegaudio.tooltip_field_audio_channels = "Η μίξη πολυκαναλικού ή στερεοφωνικού ήχου σε μονοφωνικό σχεδόν υποδιπλασιάζει το μέγεθος αρχείου των ηχογραφήσεων ομιλίας."
proc.ffmpegaudio.tooltip_field_normalisation = "Εξισορροπεί την ένταση σύμφωνα με το EBU R128 ώστε ηχογραφήσεις διαφορετικής έντασης να αναπαράγονται εξίσου δυνατά.<br>Τα -23 LUFS είναι το πρότυπο εκπομπής, τα -16 LUFS είναι σύνηθες στο web και για podcasts.<br>Η μέτρηση και η διόρθωση γίνονται σε ένα πέρασμα: ελαφρώς λιγότερο ακριβές από δύο περάσματα, αλλά χωρίς πρόσθετο χρόνο επεξεργασίας."
proc.ffmpegaudio.tooltip_field_gain = "Αυξάνει ή μειώνει τη στάθμη κατά τη δηλωμένη τιμή σε ντεσιμπέλ. Σε συνδυασμό με κανονικοποίηση η τιμή λειτουργεί ως απόκλιση από τον στόχο της.<br>Προσοχή: η αύξηση της στάθμης μπορεί να προκαλέσει παραμόρφωση (clipping)."
proc.ffmpegaudio.tooltip_field_start_time = "Η μετατροπή ξεκινά σε αυτή τη θέση, π.χ. 5 ή 00:00:05"
proc.ffmpegaudio.tooltip_field_duration = "Μήκος του αποσπάσματος από την ώρα έναρξης, π.χ. 30 για προεπισκόπηση μισού λεπτού. Κενό = έως το τέλος."
proc.ffmpegaudio.tooltip_field_fade_in = "Σταδιακή εμφάνιση της αρχής για τον δηλωμένο χρόνο σε δευτερόλεπτα, π.χ. 2 ή 1.5. Αφαιρεί την απότομη αίσθηση από ξαφνικές αρχές."
proc.ffmpegaudio.tooltip_field_fade_out = "Σταδιακό σβήσιμο του τέλους για τον δηλωμένο χρόνο σε δευτερόλεπτα. Το σημείο έναρξης υπολογίζεται από τη διάρκεια του αρχείου προορισμού και επομένως λαμβάνει υπόψη ώρα έναρξης και μήκος.<br>Αν η διάρκεια της πηγής είναι άγνωστη, δεν γίνεται σβήσιμο."
proc.ffmpegaudio.tooltip_field_strip_meta = "Αφαιρεί όλα τα μεταδεδομένα από το αρχείο προορισμού, συμπεριλαμβανομένων τίτλου, καλλιτέχνη και άλμπουμ. Συνήθως ανεπιθύμητο για ήχο, αλλά χρήσιμο π.χ. για φωνητικές ηχογραφήσεις που φέρουν όνομα συσκευής και τοποθεσία."
proc.ffmpegaudio.tooltip_field_keep_cover = "Διατηρεί μια εικόνα εξωφύλλου ενσωματωμένη στο αρχείο προέλευσης. Ισχύει μόνο για MP3, M4A και FLAC.<br>Αν η πηγή φέρει πραγματική ροή βίντεο αντί για εικόνα εξωφύλλου, αυτή η ροή απορρίπτεται πάντα: ο ήχος παραμένει."
proc.ffmpegaudio.tooltip_field_threads = "Αριθμός πυρήνων που μπορεί να χρησιμοποιήσει το ffmpeg. Αφήστε κενό για να αποφασίσει το ffmpeg. Οι περισσότεροι κωδικοποιητές ήχου εκτελούνται ούτως ή άλλως σε έναν πυρήνα."
proc.ffmpegaudio.tooltip_field_background_process = "Συνήθως δεν χρειάζεται για ήχο. Για πολύ μεγάλες ηχογραφήσεις (κηρύγματα, συναυλίες, ηχητικά βιβλία) η λειτουργία παρασκηνίου εμποδίζει το αίτημα web να ξεπεράσει το χρονικό όριο της PHP ή του διακομιστή web.<br>Η πρόοδος παρακολουθείται από cron job (trigger_bg.php)."
proc.ffmpegaudio.tooltip_field_max_time_out = "Η μετατροπή διακόπτεται μετά από αυτόν τον χρόνο. Αποτρέπει ένα κατεστραμμένο αρχείο από το να καταλαμβάνει επ’ αόριστον χρόνο επεξεργασίας."
proc.ffmpegaudio.tooltip_field_parameter1 = "Επιλογές εισόδου που τοποθετούνται πριν από το αρχείο προέλευσης,<br>π.χ. -guess_layout_max 0"
proc.ffmpegaudio.tooltip_field_parameter2 = "Προσαρμοσμένες επιλογές εξόδου, π.χ. -cutoff 18000.<br>Αν δοθεί εδώ επιλογή που αντικαθιστά ένα από τα παραπάνω πεδία (π.χ. -b:a ή -af), υπερισχύει η προσαρμοσμένη τιμή και το αντίστοιχο πεδίο αγνοείται. Όλα τα άλλα πεδία παραμένουν σε ισχύ."
proc.ffmpegaudio.field_container = "Περιέκτης"
