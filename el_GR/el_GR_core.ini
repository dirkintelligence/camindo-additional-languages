proc.ffmpegimage.tooltip_field_format = "Το JPEG είναι η συνήθης επιλογή για εικόνες προεπισκόπησης βίντεο.<br>Το PNG είναι χωρίς απώλειες και επομένως σημαντικά μεγαλύτερο.<br>Το WebP παράγει τα μικρότερα αρχεία στην ίδια ποιότητα, αλλά δεν εμφανίζεται από πολύ παλιά προγράμματα περιήγησης.<br>Η μορφή θα πρέπει να ταιριάζει με την επέκταση αρχείου της έκδοσης."
proc.ffmpegimage.tooltip_field_quality = "100 = καλύτερη ποιότητα, 0 = χειρότερη.<br>Συνήθεις τιμές: 70 έως 85.<br>Με το PNG η εικόνα είναι πάντα χωρίς απώλειες, η τιμή ελέγχει μόνο πόσο συμπιέζεται."
proc.ffmpegimage.tooltip_field_frame_mode = "Η \"Σταθερή θέση\" παίρνει πάντα το καρέ στο ίδιο σημείο.<br>Το \"Ποσοστό της διάρκειας\" προσαρμόζεται στο μήκος της ταινίας και επομένως δεν ξεπερνά το τέλος σύντομων βίντεο.<br>Η \"Αυτόματη επιλογή\" αφήνει το ffmpeg να διαλέξει το πιο αντιπροσωπευτικό από πολλά καρέ και έτσι αποφεύγει μαύρα αρχικά καρέ."
proc.ffmpegimage.tooltip_field_frame_time = "Θέση στην ταινία, π.χ. 5 ή 00:00:05.<br>Σε λειτουργία αυτόματης επιλογής η αναζήτηση ξεκινά από αυτή τη θέση. Κενό = στην αρχή.<br>Αν η τιμή βρίσκεται μετά το τέλος της ταινίας, λαμβάνεται το τελευταίο καρέ."
proc.ffmpegimage.tooltip_field_frame_percent = "Ποσοστό της συνολικής διάρκειας, π.χ. 10% μιας ταινίας δύο λεπτών = δευτερόλεπτο 12.<br>Αξιολογείται μόνο σε λειτουργία ποσοστού διάρκειας."
proc.ffmpegimage.tooltip_field_scan_frames = "Αριθμός καρέ από τα οποία επιλέγεται η εικόνα προεπισκόπησης. Περισσότερα καρέ σημαίνουν καλύτερη επιλογή και περισσότερο χρόνο επεξεργασίας.<br>Αξιολογείται μόνο σε λειτουργία αυτόματης επιλογής."
proc.ffmpegimage.tooltip_field_crop = "Περικοπή της εικόνας για να καλύψει τις νέες διαστάσεις ή προσαρμογή ολόκληρης της εικόνας μέσα σε αυτές;"
proc.ffmpegimage.tooltip_field_prevent_upscaling = "Αν το βίντεο είναι μικρότερο από τις διαστάσεις προορισμού, δεν μεγεθύνεται. Η μεγέθυνση κοστίζει μόνο χρόνο επεξεργασίας και μέγεθος αρχείου χωρίς να προσθέτει λεπτομέρεια."
proc.ffmpegimage.tooltip_field_deinterlace = "Το πεπλεγμένο υλικό (π.χ. από εκπομπή) εμφανίζει διαφορετικά τεχνουργήματα χτένας στην κίνηση, ιδιαίτερα ορατά σε στατικό καρέ.<br>Το \"Αυτόματα\" εφαρμόζει το φίλτρο μόνο σε καρέ που πράγματι επηρεάζονται."
proc.ffmpegimage.tooltip_field_auto_rotation = "Τα κάθετα βίντεο από κινητά τηλέφωνα αποθηκεύονται φυσικά οριζόντια και φέρουν την περιστροφή στα μεταδεδομένα τους. Με αυτή την επιλογή ανενεργή η εικόνα παραμένει πλάγια."
proc.ffmpegimage.tooltip_field_sharpen = "Η έντονη σμίκρυνση χάνει τις ακμές. Μια μέτρια όξυνση κάνει την εικόνα προεπισκόπησης ξανά καθαρή χωρίς να παράγει ορατά φωτοστέφανα."
proc.ffmpegimage.tooltip_field_strip_meta = "Αφαιρεί όλα τα μεταδεδομένα από το αρχείο προορισμού, ιδίως δεδομένα τοποθεσίας και το όνομα συσκευής από ηχογραφήσεις κινητών."
proc.ffmpegimage.tooltip_field_threads = "Αριθμός πυρήνων που μπορεί να χρησιμοποιήσει το ffmpeg. Αφήστε κενό για να αποφασίσει το ffmpeg. Σε κοινόχρηστους διακομιστές συνιστάται όριο."
proc.ffmpegimage.tooltip_field_background_process = "Συνιστάται αν οι εικόνες προεπισκόπησης δημιουργούνται από βίντεο που με τη σειρά τους αποδίδονται στο παρασκήνιο: το cron job (trigger_ff.php) εκκινεί αυτόν τον μετατροπέα μόλις το βίντεο είναι διαθέσιμο και παρακολουθεί στη συνέχεια την πρόοδο.<br>Χωρίς αυτή τη ρύθμιση η κλήση περιμένει μέχρι να ολοκληρωθεί η εικόνα. Με πηγή που είναι ήδη διαθέσιμη αυτό διαρκεί μόνο δευτερόλεπτα."
proc.ffmpegimage.tooltip_field_max_time_out = "Η μετατροπή διακόπτεται μετά από αυτόν τον χρόνο. Αποτρέπει ένα κατεστραμμένο αρχείο από το να καταλαμβάνει επ’ αόριστον χρόνο επεξεργασίας."
proc.ffmpegimage.tooltip_field_parameter1 = "Επιλογές εισόδου που τοποθετούνται πριν από το αρχείο προέλευσης,<br>π.χ. -hwaccel auto"
proc.ffmpegimage.tooltip_field_parameter2 = "Προσαρμοσμένες επιλογές εξόδου, π.χ. -vf \"hue=s=0\".<br>Αν δοθεί εδώ επιλογή που αντικαθιστά ένα από τα παραπάνω πεδία (π.χ. -vf ή -q:v), υπερισχύει η προσαρμοσμένη τιμή και το αντίστοιχο πεδίο αγνοείται."
