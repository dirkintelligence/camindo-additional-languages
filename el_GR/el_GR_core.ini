proc.ffmpegvideo.tooltip_field_codec = "Το H.264 αναπαράγεται παντού.<br>Τα H.265 και AV1 παράγουν μικρότερα αρχεία, αλλά χρειάζονται περισσότερο χρόνο επεξεργασίας και δεν υποστηρίζονται από κάθε συσκευή.<br>Η \"Αντιγραφή\" παίρνει τη ροή βίντεο αμετάβλητη: πολύ γρήγορο, αλλά διαστάσεις, ποιότητα και φίλτρα δεν έχουν τότε καμία επίδραση."
