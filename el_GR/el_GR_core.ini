proc.ffmpegvideo.tooltip_field_quality_mode = "Το CRF διατηρεί σταθερή την ποιότητα και αφήνει το μέγεθος αρχείου να προσαρμόζεται.<br>Ο ρυθμός bit διατηρεί σταθερό το μέγεθος και αφήνει την ποιότητα να προσαρμόζεται. Για το web, το CRF είναι συνήθως η καλύτερη επιλογή."
proc.ffmpegvideo.tooltip_field_quality = "0 = χωρίς απώλειες, 51 = χειρότερη ποιότητα.<br>Συνήθεις τιμές: 18 έως 28, προεπιλογή 23.<br>Τα VP9 και AV1 χρησιμοποιούν 0 έως 63, οι μεγαλύτερες τιμές περιορίζονται."
