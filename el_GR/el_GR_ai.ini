ai.text_how = "Ο βοηθός βλέπει ακριβώς ό,τι βλέπετε εσείς και μπορεί να κάνει ακριβώς ό,τι μπορείτε εσείς. Αναζητά, διαβάζει, δημιουργεί και αλλάζει μέσω των ίδιων λειτουργιών με τη διεπαφή χρήστη· κάθε αλλαγή εμφανίζεται στο αρχείο καταγραφής ελέγχου με το όνομά σας, επισημασμένη ως ενέργεια του βοηθού. Δεν αλλάζει εγγραφές που έχετε ανοιχτές σε φόρμα επεξεργασίας - σας ζητά πρώτα να κλείσετε τη φόρμα."
