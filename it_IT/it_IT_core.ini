proc.ffmpegimage.tooltip_field_format = "JPEG è la scelta abituale per le immagini di anteprima dei video.<br>PNG è senza perdita e quindi notevolmente più grande.<br>WebP produce i file più piccoli a parità di qualità, ma non viene visualizzato dai browser molto vecchi.<br>Il formato dovrebbe corrispondere all’estensione del file della versione."
proc.ffmpegimage.tooltip_field_quality = "100 = qualità migliore, 0 = peggiore.<br>Valori comuni: da 70 a 85.<br>Con PNG l’immagine è sempre senza perdita, il valore controlla solo quanto viene compressa."
proc.ffmpegimage.tooltip_field_frame_mode = "\"Posizione fissa\" prende sempre il fotogramma nello stesso punto.<br>\"Quota della durata\" si adatta alla lunghezza del filmato e quindi non va oltre la fine dei video brevi.<br>\"Selezione automatica\" lascia scegliere a ffmpeg il più rappresentativo tra più fotogrammi ed evita così i fotogrammi neri iniziali."
proc.ffmpegimage.tooltip_field_frame_time = "Posizione nel filmato, ad es. 5 o 00:00:05.<br>In modalità selezione automatica la ricerca inizia da questa posizione. Vuoto = all’inizio.<br>Se il valore va oltre la fine del filmato, viene preso l’ultimo fotogramma."
proc.ffmpegimage.tooltip_field_frame_percent = "Quota della durata totale, ad es. il 10% di un filmato di due minuti = secondo 12.<br>Valutato solo in modalità quota della durata."
proc.ffmpegimage.tooltip_field_scan_frames = "Numero di fotogrammi tra cui viene scelta l’immagine di anteprima. Più fotogrammi significano una scelta migliore e più tempo di elaborazione.<br>Valutato solo in modalità selezione automatica."
proc.ffmpegimage.tooltip_field_crop = "Ritagliare l’immagine per riempire le nuove dimensioni o adattare l’intera immagine al loro interno?"
proc.ffmpegimage.tooltip_field_prevent_upscaling = "Se il video è più piccolo delle dimensioni di destinazione non viene ingrandito. L’ingrandimento costa solo tempo di elaborazione e dimensione del file senza aggiungere dettagli."
proc.ffmpegimage.tooltip_field_deinterlace = "Il materiale interlacciato (ad es. da broadcast) mostra altrimenti artefatti a pettine nel movimento, particolarmente visibili in un fotogramma fisso.<br>\"Automatico\" applica il filtro solo ai fotogrammi effettivamente interessati."
proc.ffmpegimage.tooltip_field_auto_rotation = "I video verticali dei telefoni cellulari sono memorizzati fisicamente in orizzontale e riportano la rotazione nei metadati. Con questa opzione disattivata l’immagine resta di lato."
proc.ffmpegimage.tooltip_field_sharpen = "Una forte riduzione fa perdere i bordi. Un aumento moderato della nitidezza rende di nuovo nitida l’immagine di anteprima senza produrre aloni visibili."
proc.ffmpegimage.tooltip_field_strip_meta = "Rimuove tutti i metadati dal file di destinazione, in particolare i dati di posizione e il nome del dispositivo delle registrazioni da cellulare."
proc.ffmpegimage.tooltip_field_threads = "Numero di core che ffmpeg può usare. Lascia vuoto per far decidere ffmpeg. Sui server condivisi è consigliabile un limite."
proc.ffmpegimage.tooltip_field_background_process = "Consigliato se le immagini di anteprima vengono create da video che a loro volta vengono elaborati in background: il cron job (trigger_ff.php) avvia questo convertitore non appena il video è disponibile e ne segue poi l’avanzamento.<br>Senza questa impostazione la chiamata attende che l’immagine sia pronta. Con un’origine già disponibile ciò richiede solo pochi secondi."
proc.ffmpegimage.tooltip_field_max_time_out = "La conversione viene interrotta dopo questo tempo. Evita che un file danneggiato occupi tempo di elaborazione all’infinito."
proc.ffmpegimage.tooltip_field_parameter1 = "Opzioni di input poste prima del file di origine,<br>ad es. -hwaccel auto"
proc.ffmpegimage.tooltip_field_parameter2 = "Opzioni di output personalizzate, ad es. -vf \"hue=s=0\".<br>Se qui viene indicata un’opzione che sostituisce uno dei campi sopra (ad es. -vf o -q:v), vince il valore personalizzato e il campo corrispondente viene ignorato."
