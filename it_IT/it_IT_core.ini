proc.ffmpegaudio.tooltip_field_container = "Il contenitore determina quali codec sono consentiti:<br>MP3 solo con MP3,<br>M4A solo con AAC,<br>Ogg con Vorbis, Opus o FLAC,<br>Opus solo con Opus,<br>FLAC e WAV sono senza perdita.<br>MP3 si riproduce ovunque, M4A e Opus suonano decisamente meglio a parità di dimensione del file."
proc.ffmpegaudio.tooltip_field_codec = "\"Adatto al contenitore\" sceglie il codec standard del contenitore selezionato. Un codec non adatto al contenitore viene reimpostato su quello standard al salvataggio.<br>\"Copia\" riprende la traccia audio invariata: molto veloce, ma qualità, frequenza di campionamento, canali, volume e dissolvenze non hanno allora alcun effetto."
proc.ffmpegaudio.tooltip_field_quality_mode = "VBR mantiene costante la qualità e lascia variare la dimensione del file.<br>Bitrate mantiene costante la dimensione e lascia variare la qualità. Per il web, VBR è di solito la scelta migliore."
proc.ffmpegaudio.tooltip_field_quality = "0 = qualità migliore, 9 = file più piccolo. Valori comuni: da 2 a 5, predefinito 4 (circa 160 kbit/s con MP3).<br>Ogni encoder ha una propria scala e il livello viene convertito automaticamente: MP3 e Vorbis hanno veri livelli di qualità, AAC e Opus ricevono un bitrate di destinazione adeguato.<br>Con FLAC il livello controlla quanto vengono compressi i dati, la qualità resta senza perdita."
proc.ffmpegaudio.tooltip_field_bitrate = "Velocità di destinazione in kbit/s, ad es. 128 per musica in stereo, 96 per il parlato, 64 per il mono.<br>Valutato solo in modalità bitrate e senza effetto per FLAC e PCM."
proc.ffmpegaudio.tooltip_field_sample_rate = "Frequenza di campionamento del file di destinazione. 44,1 kHz è la frequenza del CD audio, 48 kHz quella usata da video e broadcast. Per il solo parlato bastano 22,05 o 16 kHz e si risparmia molto spazio.<br>Opus lavora sempre internamente a 48 kHz."
proc.ffmpegaudio.tooltip_field_audio_channels = "Il downmix di audio multicanale o stereo in mono dimezza quasi la dimensione del file delle registrazioni vocali."
proc.ffmpegaudio.tooltip_field_normalisation = "Allinea il volume secondo EBU R128, in modo che registrazioni di volume diverso vengano riprodotte allo stesso volume.<br>-23 LUFS è lo standard broadcast, -16 LUFS è comune sul web e per i podcast.<br>Misurazione e correzione avvengono in un unico passaggio: leggermente meno preciso di due passaggi, ma senza tempo di elaborazione aggiuntivo."
proc.ffmpegaudio.tooltip_field_gain = "Alza o abbassa il livello della quantità indicata in decibel. In combinazione con la normalizzazione il valore agisce come scostamento rispetto al suo obiettivo.<br>Attenzione: alzare il livello può causare clipping."
proc.ffmpegaudio.tooltip_field_start_time = "La conversione inizia in questa posizione, ad es. 5 o 00:00:05"
proc.ffmpegaudio.tooltip_field_duration = "Lunghezza dell’estratto a partire dall’ora di inizio, ad es. 30 per un’anteprima di mezzo minuto. Vuoto = fino alla fine."
proc.ffmpegaudio.tooltip_field_fade_in = "Introduce l’inizio in dissolvenza per il tempo indicato in secondi, ad es. 2 o 1.5. Toglie la durezza agli inizi bruschi."
proc.ffmpegaudio.tooltip_field_fade_out = "Sfuma la fine per il tempo indicato in secondi. Il punto di inizio viene calcolato dalla durata del file di destinazione e rispetta quindi ora di inizio e lunghezza.<br>Se la durata dell’origine è sconosciuta, non viene applicata alcuna dissolvenza."
proc.ffmpegaudio.tooltip_field_strip_meta = "Rimuove tutti i metadati dal file di destinazione, compresi titolo, artista e album. Di solito indesiderato per l’audio, ma utile ad es. per registrazioni vocali che riportano il nome del dispositivo e una posizione."
proc.ffmpegaudio.tooltip_field_keep_cover = "Mantiene un’immagine di copertina incorporata nel file di origine. Efficace solo per MP3, M4A e FLAC.<br>Se l’origine contiene una vera traccia video invece di un’immagine di copertina, questa traccia viene sempre scartata: resta l’audio."
proc.ffmpegaudio.tooltip_field_threads = "Numero di core che ffmpeg può usare. Lascia vuoto per far decidere ffmpeg. La maggior parte degli encoder audio usa comunque un solo core."
proc.ffmpegaudio.tooltip_field_background_process = "Di solito non necessario per l’audio. Per registrazioni molto lunghe (prediche, concerti, audiolibri) la modalità in background evita che la richiesta web superi il limite di tempo di PHP o del server web.<br>L’avanzamento viene seguito da un cron job (trigger_bg.php)."
proc.ffmpegaudio.tooltip_field_max_time_out = "La conversione viene interrotta dopo questo tempo. Evita che un file danneggiato occupi tempo di elaborazione all’infinito."
proc.ffmpegaudio.tooltip_field_parameter1 = "Opzioni di input poste prima del file di origine,<br>ad es. -guess_layout_max 0"
proc.ffmpegaudio.tooltip_field_parameter2 = "Opzioni di output personalizzate, ad es. -cutoff 18000.<br>Se qui viene indicata un’opzione che sostituisce uno dei campi sopra (ad es. -b:a o -af), vince il valore personalizzato e il campo corrispondente viene ignorato. Tutti gli altri campi restano validi."
