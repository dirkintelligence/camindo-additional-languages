proc.ffmpegvideo.tooltip_field_deinterlace = "Il materiale interlacciato (ad es. da broadcast) mostra altrimenti artefatti a pettine nel movimento.<br>\"Automatico\" applica il filtro solo ai fotogrammi effettivamente interessati."
proc.ffmpegvideo.tooltip_field_auto_rotation = "I video verticali dei telefoni cellulari sono memorizzati fisicamente in orizzontale e riportano la rotazione nei metadati. Con questa opzione disattivata l’immagine resta di lato."
