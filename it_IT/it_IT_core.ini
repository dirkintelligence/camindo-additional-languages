proc.ffmpegvideo.tooltip_field_codec = "H.264 si riproduce ovunque.<br>H.265 e AV1 producono file più piccoli, ma richiedono più tempo di elaborazione e non sono supportati da tutti i dispositivi.<br>\"Copia\" riprende la traccia video invariata: molto veloce, ma dimensioni, qualità e filtri non hanno allora alcun effetto."
proc.ffmpegvideo.tooltip_field_crop = "Ritagliare il video per riempire le nuove dimensioni o adattare l’intera immagine al loro interno?"
proc.ffmpegvideo.tooltip_field_prevent_upscaling = "Se l’origine è più piccola delle dimensioni di destinazione non viene ingrandita. L’ingrandimento costa solo tempo di elaborazione e dimensione del file senza aggiungere dettagli."
proc.ffmpegvideo.tooltip_field_quality_mode = "CRF mantiene costante la qualità e lascia variare la dimensione del file.<br>Bitrate mantiene costante la dimensione e lascia variare la qualità. Per il web, CRF è di solito la scelta migliore."
proc.ffmpegvideo.tooltip_field_quality = "0 = senza perdita, 51 = qualità peggiore.<br>Valori comuni: da 18 a 28, predefinito 23.<br>VP9 e AV1 usano da 0 a 63, i valori più alti vengono limitati."
proc.ffmpegvideo.tooltip_field_bitrate = "Velocità di destinazione in kbit/s, ad es. 2500 per 720p.<br>Valutato solo in modalità bitrate."
proc.ffmpegvideo.tooltip_field_preset = "Compromesso tra tempo di elaborazione e dimensione del file. Più lento significa più piccolo a parità di qualità. I nomi vengono convertiti automaticamente nelle scale usate da VP9 e AV1."
proc.ffmpegvideo.tooltip_field_max_fps = "Limite superiore per la frequenza dei fotogrammi. Se l’origine è più lenta resta invariata: i fotogrammi non vengono mai inventati."
proc.ffmpegvideo.tooltip_field_start_time = "La conversione inizia in questa posizione, ad es. 5 o 00:00:05"
proc.ffmpegvideo.tooltip_field_duration = "Lunghezza dell’estratto a partire dall’ora di inizio, ad es. 10 per un’anteprima di dieci secondi. Vuoto = fino alla fine."
proc.ffmpegvideo.tooltip_field_faststart = "Sposta l’indice all’inizio del file, così il video può iniziare la riproduzione prima di essere caricato completamente. Efficace solo per MP4."
