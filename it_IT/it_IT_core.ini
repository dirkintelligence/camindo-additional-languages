proc.ffmpegvideo.tooltip_field_audio_channels = "Il downmix di audio multicanale in stereo o mono fa risparmiare bitrate."
proc.ffmpegvideo.tooltip_field_audio_normalisation = "Allinea il volume a -23 LUFS secondo EBU R128, in modo che video di volume diverso vengano riprodotti allo stesso volume. Richiede tempo di elaborazione aggiuntivo."
