ai.module_label = "Assistente IA"
ai.module_description = "Un modello linguistico che lavora nel backend per tuo conto e con i tuoi permessi"
ai.headline = "Assistente IA"
ai.button_open = "Apri assistente"
ai.note_not_configured = "L’assistente non è ancora configurato: nella configurazione manca la chiave API del fornitore (ai.api_key)."
