ai.headline_shortcut = "Scorciatoia da tastiera"
ai.text_shortcut = "apre l’assistente nel pannello laterale, da qualsiasi pagina del backend."
ai.text_shortcut_mac = "Su Mac: Comando (⌘) + K. Dove un editor usa da sé questi tasti (ad es. per \"Inserisci link\"), lì vale la sua funzione."
ai.headline_how = "Come lavora l’assistente"
ai.text_how = "L’assistente vede esattamente ciò che vedi tu e può fare esattamente ciò che puoi fare tu. Cerca, legge, crea e modifica tramite le stesse funzioni dell’interfaccia utente; ogni modifica compare nel registro di audit a tuo nome, contrassegnata come azione dell’assistente. Non modifica i record che hai attualmente aperti in un modulo di modifica - ti chiede prima di chiudere il modulo."
ai.text_how_encrypted = "Eccezione: l’assistente non vede il contenuto dei campi crittografati – riceve solo il segnaposto «[encrypted]». In questi campi può cercare solo valori che compaiono esattamente come indicati, ad esempio un indirizzo email che gli comunichi."
ai.headline_disclaimer = "Nota bene"
ai.text_disclaimer = "L’assistente è un modello linguistico di un fornitore esterno. Ciò che scrivi e ciò che l’assistente legge nel CMS viene inviato a questo fornitore. Le risposte possono essere errate o incomplete - verifica i risultati prima di farvi affidamento e conferma solo le modifiche che comprendi."
ai.headline_levels = "Conferme"
ai.text_levels = "Le azioni sono raggruppate per gravità. Dal livello 1 in su, l’assistente chiede prima di agire. Consenti la singola azione oppure - fino alla fine della chat - tutte le azioni dello stesso livello."
