proc.ffmpegaudio.note_parameter2 = "Parametrar efter källfilen (utdataalternativ)"
proc.ffmpegaudio.tooltip_field_container = "Behållaren avgör vilka codecs som är tillåtna:<br>MP3 endast med MP3,<br>M4A endast med AAC,<br>Ogg med Vorbis, Opus eller FLAC,<br>Opus endast med Opus,<br>FLAC och WAV är förlustfria.<br>MP3 spelas överallt, M4A och Opus låter tydligt bättre vid samma filstorlek."
proc.ffmpegaudio.tooltip_field_codec = "”Enligt behållaren” väljer standardcodec för den valda behållaren. En codec som inte passar behållaren återställs till denna standard när du sparar.<br>”Kopiera” tar ljudströmmen oförändrad: mycket snabbt, men kvalitet, samplingsfrekvens, kanaler, ljudstyrka och toningar har då ingen effekt."
proc.ffmpegaudio.tooltip_field_quality_mode = "VBR håller kvaliteten konstant och låter filstorleken variera.<br>Bithastighet håller storleken konstant och låter kvaliteten variera. För webben är VBR oftast det bättre valet."
proc.ffmpegaudio.tooltip_field_quality = "0 = bästa kvalitet, 9 = minsta fil. Vanliga värden: 2 till 5, standard 4 (cirka 160 kbit/s med MP3).<br>Varje kodare har sin egen skala och nivån översätts automatiskt: MP3 och Vorbis har riktiga kvalitetsnivåer, AAC och Opus får en motsvarande målbithastighet.<br>Med FLAC styr nivån hur hårt data packas, kvaliteten förblir förlustfri."
proc.ffmpegaudio.tooltip_field_bitrate = "Målhastighet i kbit/s, t.ex. 128 för musik i stereo, 96 för tal, 64 för mono.<br>Används endast i bithastighetsläge och har ingen effekt för FLAC och PCM."
proc.ffmpegaudio.tooltip_field_sample_rate = "Målfilens samplingsfrekvens. 44,1 kHz är ljud-CD:ns frekvens, 48 kHz den som används för video och sändning. För enbart tal räcker 22,05 eller 16 kHz och sparar mycket utrymme.<br>Opus arbetar alltid internt med 48 kHz."
proc.ffmpegaudio.tooltip_field_audio_channels = "Att mixa ned flerkanals- eller stereoljud till mono halverar nästan filstorleken för talinspelningar."
proc.ffmpegaudio.tooltip_field_normalisation = "Jämnar ut ljudstyrkan enligt EBU R128 så att inspelningar med olika ljudstyrka spelas upp lika högt.<br>-23 LUFS är sändningsstandarden, -16 LUFS är vanligt på webben och för podcasts.<br>Mätning och korrigering sker i ett enda pass: något mindre exakt än två pass, men utan extra bearbetningstid."
proc.ffmpegaudio.tooltip_field_gain = "Höjer eller sänker nivån med det angivna värdet i decibel. Tillsammans med normalisering fungerar värdet som en förskjutning av dess mål.<br>Obs: att höja nivån kan orsaka klippning."
proc.ffmpegaudio.tooltip_field_start_time = "Konverteringen börjar vid den här positionen, t.ex. 5 eller 00:00:05"
proc.ffmpegaudio.tooltip_field_duration = "Utdragets längd från starttiden, t.ex. 30 för en halvminuts förhandslyssning. Tomt = till slutet."
proc.ffmpegaudio.tooltip_field_fade_in = "Tonar in början under den angivna tiden i sekunder, t.ex. 2 eller 1.5. Tar bort skärpan i abrupta starter."
proc.ffmpegaudio.tooltip_field_fade_out = "Tonar ut slutet under den angivna tiden i sekunder. Startpunkten beräknas utifrån målfilens längd och tar därför hänsyn till starttid och längd.<br>Om källans längd är okänd tonas ingenting ut."
proc.ffmpegaudio.tooltip_field_strip_meta = "Tar bort all metadata från målfilen, inklusive titel, artist och album. Oftast inte önskvärt för ljud, men användbart t.ex. för röstinspelningar med enhetsnamn och plats."
proc.ffmpegaudio.tooltip_field_keep_cover = "Behåller en omslagsbild som är inbäddad i källfilen. Fungerar endast för MP3, M4A och FLAC.<br>Om källan innehåller en riktig videoström i stället för en omslagsbild kasseras den strömmen alltid: ljudet finns kvar."
proc.ffmpegaudio.tooltip_field_threads = "Antal kärnor som ffmpeg får använda. Lämna tomt för att låta ffmpeg bestämma. De flesta ljudkodare körs ändå på en enda kärna."
proc.ffmpegaudio.tooltip_field_background_process = "Behövs oftast inte för ljud. För mycket långa inspelningar (predikningar, konserter, ljudböcker) förhindrar bakgrundsläget att webbförfrågan når tidsgränsen för PHP eller webbservern.<br>Förloppet följs av ett cron-jobb (trigger_bg.php)."
proc.ffmpegaudio.tooltip_field_max_time_out = "Konverteringen avbryts efter den här tiden. Förhindrar att en trasig fil upptar bearbetningstid i all oändlighet."
proc.ffmpegaudio.tooltip_field_parameter1 = "Indataalternativ som placeras före källfilen,<br>t.ex. -guess_layout_max 0"
proc.ffmpegaudio.tooltip_field_parameter2 = "Egna utdataalternativ, t.ex. -cutoff 18000.<br>Om ett alternativ anges här som ersätter något av fälten ovan (t.ex. -b:a eller -af) vinner det egna värdet och motsvarande fält ignoreras. Alla andra fält gäller fortfarande."
