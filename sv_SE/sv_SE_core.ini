proc.ffmpegimage.tooltip_field_format = "JPEG är det vanliga valet för förhandsvisningsbilder av video.<br>PNG är förlustfritt och därför betydligt större.<br>WebP ger de minsta filerna vid samma kvalitet men visas inte av mycket gamla webbläsare.<br>Formatet bör passa versionens filändelse."
proc.ffmpegimage.tooltip_field_quality = "100 = bästa kvalitet, 0 = sämsta.<br>Vanliga värden: 70 till 85.<br>Med PNG är bilden alltid förlustfri, värdet styr bara hur hårt den packas."
proc.ffmpegimage.tooltip_field_frame_mode = "”Fast position” tar alltid bildrutan på samma ställe.<br>”Andel av längden” anpassar sig efter filmens längd och går därför inte förbi slutet på korta videor.<br>”Välj automatiskt” låter ffmpeg välja den mest representativa av flera bildrutor och undviker på så sätt svarta inledande bildrutor."
proc.ffmpegimage.tooltip_field_frame_time = "Position i filmen, t.ex. 5 eller 00:00:05.<br>I läget automatiskt val börjar sökningen vid den här positionen. Tomt = i början.<br>Om värdet ligger efter filmens slut tas den sista bildrutan."
proc.ffmpegimage.tooltip_field_frame_percent = "Andel av den totala längden, t.ex. 10 % av en två minuter lång film = sekund 12.<br>Används endast i läget andel av längden."
proc.ffmpegimage.tooltip_field_scan_frames = "Antal bildrutor som förhandsvisningsbilden väljs bland. Fler bildrutor innebär ett bättre val och längre bearbetningstid.<br>Används endast i läget automatiskt val."
proc.ffmpegimage.tooltip_field_crop = "Beskär bilden för att fylla de nya måtten, eller passa in hela bilden i dem?"
proc.ffmpegimage.tooltip_field_prevent_upscaling = "Om videon är mindre än målmåtten förstoras den inte. Förstoring kostar bara bearbetningstid och filstorlek utan att tillföra några detaljer."
proc.ffmpegimage.tooltip_field_deinterlace = "Radsprångsmaterial (t.ex. från sändningar) visar annars kamartefakter vid rörelse, särskilt synliga i en stillbild.<br>”Automatiskt” tillämpar filtret endast på bildrutor som faktiskt påverkas."
proc.ffmpegimage.tooltip_field_auto_rotation = "Stående videor från mobiltelefoner lagras fysiskt liggande och bär rotationen i sin metadata. Med det här alternativet avstängt ligger bilden på sidan."
proc.ffmpegimage.tooltip_field_sharpen = "Kraftig förminskning gör att kanter går förlorade. Måttlig skärpning gör förhandsvisningsbilden skarp igen utan att skapa synliga halor."
proc.ffmpegimage.tooltip_field_strip_meta = "Tar bort all metadata från målfilen, särskilt platsdata och enhetsnamnet från mobiltelefoninspelningar."
proc.ffmpegimage.tooltip_field_threads = "Antal kärnor som ffmpeg får använda. Lämna tomt för att låta ffmpeg bestämma. På delade servrar är en gräns att rekommendera."
proc.ffmpegimage.tooltip_field_background_process = "Rekommenderas om förhandsvisningsbilderna skapas från videor som själva renderas i bakgrunden: cron-jobbet (trigger_ff.php) startar den här konverteraren så snart videon finns tillgänglig och följer sedan förloppet.<br>Utan den här inställningen väntar anropet tills bilden är klar. Med en källa som redan finns tar det bara några sekunder."
proc.ffmpegimage.tooltip_field_max_time_out = "Konverteringen avbryts efter den här tiden. Förhindrar att en trasig fil upptar bearbetningstid i all oändlighet."
proc.ffmpegimage.tooltip_field_parameter1 = "Indataalternativ som placeras före källfilen,<br>t.ex. -hwaccel auto"
