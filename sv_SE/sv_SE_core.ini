proc.ffmpegvideo.tooltip_field_quality = "0 = förlustfritt, 51 = sämsta kvalitet.<br>Vanliga värden: 18 till 28, standard 23.<br>VP9 och AV1 använder 0 till 63, högre värden begränsas."
