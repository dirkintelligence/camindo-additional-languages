proc.ffmpegvideo.tooltip_field_codec = "H.264 spelas överallt.<br>H.265 och AV1 ger mindre filer men kräver mer bearbetningstid och stöds inte av alla enheter.<br>”Kopiera” tar videoströmmen oförändrad: mycket snabbt, men mått, kvalitet och filter har då ingen effekt."
