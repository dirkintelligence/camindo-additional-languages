ai.headline_shortcut = "Sneltoets"
ai.text_shortcut = "opent de assistent in het zijpaneel, vanaf elke pagina van de backend."
ai.text_shortcut_mac = "Op een Mac: Command (⌘) + K. Waar een editor de toetsen zelf gebruikt (bijv. voor “Link invoegen”), geldt daar de functie van de editor."
ai.headline_how = "Zo werkt de assistent"
ai.text_how = "De assistent ziet precies wat jij ziet en mag precies wat jij mag. Hij zoekt, leest, maakt aan en wijzigt via dezelfde functies als de gebruikersinterface; elke wijziging verschijnt in het auditlog onder jouw naam, gemarkeerd als actie van de assistent. Records die je momenteel in een bewerkingsformulier open hebt, wijzigt hij niet – hij vraagt je eerst het formulier te sluiten."
ai.text_how_encrypted = "Uitzondering: de assistent ziet de inhoud van versleutelde velden niet – hij krijgt alleen de plaatsaanduiding “[encrypted]”. In deze velden kan hij alleen zoeken naar waarden die precies zo voorkomen, zoals een e-mailadres dat je hem noemt."
ai.headline_disclaimer = "Let op"
ai.text_disclaimer = "De assistent is een taalmodel van een externe provider. Wat je schrijft en wat de assistent in het CMS leest, wordt naar deze provider gestuurd. Antwoorden kunnen onjuist of onvolledig zijn – controleer resultaten voordat je erop vertrouwt, en bevestig alleen wijzigingen die je begrijpt."
ai.headline_levels = "Bevestigingen"
ai.text_levels = "Acties zijn ingedeeld naar zwaarte. Vanaf niveau 1 vraagt de assistent voordat hij handelt. Je staat de afzonderlijke actie toe of – tot het einde van de chat – alle acties van hetzelfde niveau."
