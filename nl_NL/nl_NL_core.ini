proc.ffmpegimage.tooltip_field_format = "JPEG is de gebruikelijke keuze voor voorbeeldafbeeldingen van video’s.<br>PNG is verliesvrij en daardoor aanzienlijk groter.<br>WebP levert bij dezelfde kwaliteit de kleinste bestanden, maar wordt door zeer oude browsers niet weergegeven.<br>Het formaat moet bij de bestandsextensie van de versie passen."
proc.ffmpegimage.tooltip_field_quality = "100 = beste kwaliteit, 0 = slechtste.<br>Gangbare waarden: 70 tot 85.<br>Bij PNG is de afbeelding altijd verliesvrij, de waarde bepaalt alleen hoe sterk ze wordt ingepakt."
proc.ffmpegimage.tooltip_field_frame_mode = "“Vaste positie” neemt altijd het frame op hetzelfde punt.<br>“Aandeel van de duur” past zich aan de lengte van de film aan en loopt daardoor bij korte video’s niet voorbij het einde.<br>“Automatisch kiezen” laat ffmpeg uit meerdere frames het meest representatieve kiezen en vermijdt zo zwarte beginframes."
proc.ffmpegimage.tooltip_field_frame_time = "Positie in de film, bijv. 5 of 00:00:05.<br>In de modus automatisch kiezen begint het zoeken op deze positie. Leeg = aan het begin.<br>Ligt de waarde voorbij het einde van de film, dan wordt het laatste frame genomen."
proc.ffmpegimage.tooltip_field_frame_percent = "Aandeel van de totale duur, bijv. 10% van een film van twee minuten = seconde 12.<br>Alleen geëvalueerd in de modus aandeel van de duur."
proc.ffmpegimage.tooltip_field_scan_frames = "Aantal frames waaruit de voorbeeldafbeelding wordt gekozen. Meer frames betekenen een betere keuze en meer verwerkingstijd.<br>Alleen geëvalueerd in de modus automatisch kiezen."
proc.ffmpegimage.tooltip_field_crop = "De afbeelding bijsnijden om de nieuwe afmetingen te vullen, of de hele afbeelding daarin laten passen?"
proc.ffmpegimage.tooltip_field_prevent_upscaling = "Is de video kleiner dan de doelafmetingen, dan wordt hij niet vergroot. Vergroten kost alleen verwerkingstijd en bestandsgrootte zonder detail toe te voegen."
proc.ffmpegimage.tooltip_field_deinterlace = "Interlaced materiaal (bijv. van de omroep) toont anders kamstructuren bij beweging, vooral zichtbaar in een stilstaand beeld.<br>“Automatisch” past het filter alleen toe op frames die werkelijk zijn getroffen."
proc.ffmpegimage.tooltip_field_auto_rotation = "Staande video’s van mobiele telefoons worden fysiek liggend opgeslagen en dragen de rotatie in hun metagegevens. Met deze optie uit blijft het beeld gekanteld."
proc.ffmpegimage.tooltip_field_sharpen = "Sterk verkleinen kost randscherpte. Gematigd verscherpen maakt de voorbeeldafbeelding weer scherp zonder zichtbare halo’s te veroorzaken."
proc.ffmpegimage.tooltip_field_strip_meta = "Verwijdert alle metagegevens uit het doelbestand, in het bijzonder locatiegegevens en de apparaatnaam van opnamen met mobiele telefoons."
proc.ffmpegimage.tooltip_field_threads = "Aantal kernen dat ffmpeg mag gebruiken. Leeg laten om ffmpeg te laten beslissen. Op gedeelde servers is een limiet aan te raden."
proc.ffmpegimage.tooltip_field_background_process = "Aanbevolen als de voorbeeldafbeeldingen worden gemaakt van video’s die zelf op de achtergrond worden gerenderd: de cronjob (trigger_ff.php) start deze converter zodra de video beschikbaar is en volgt daarna de voortgang.<br>Zonder deze instelling wacht de aanroep tot de afbeelding klaar is. Bij een bron die al beschikbaar is, duurt dat slechts seconden."
proc.ffmpegimage.tooltip_field_max_time_out = "De conversie wordt na deze tijd afgebroken. Voorkomt dat een defect bestand onbeperkt verwerkingstijd bezet."
proc.ffmpegimage.tooltip_field_parameter1 = "Invoeropties die vóór het bronbestand worden geplaatst,<br>bijv. -hwaccel auto"
proc.ffmpegimage.tooltip_field_parameter2 = "Eigen uitvoeropties, bijv. -vf \"hue=s=0\".<br>Wordt hier een optie opgegeven die een van de velden hierboven vervangt (bijv. -vf of -q:v), dan wint de eigen waarde en wordt het bijbehorende veld genegeerd."
