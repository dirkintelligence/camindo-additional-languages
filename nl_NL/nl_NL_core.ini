proc.ffmpegvideo.tooltip_field_container = "De container bepaalt welke codecs zijn toegestaan:<br>MP4 met H.264/H.265/AV1 en AAC/MP3,<br>WebM alleen met VP9/AV1 en Opus,<br>Matroska met elke combinatie."
proc.ffmpegvideo.tooltip_field_codec = "H.264 speelt overal af.<br>H.265 en AV1 leveren kleinere bestanden, maar vergen meer verwerkingstijd en worden niet door elk apparaat ondersteund.<br>“Kopiëren” neemt de videostream ongewijzigd over: zeer snel, maar afmetingen, kwaliteit en filters hebben dan geen effect."
