proc.ffmpegvideo.tooltip_field_quality_mode = "CRF houdt de kwaliteit constant en laat de bestandsgrootte meebewegen.<br>Bitrate houdt de grootte constant en laat de kwaliteit meebewegen. Voor het web is CRF meestal de betere keuze."
proc.ffmpegvideo.tooltip_field_quality = "0 = verliesvrij, 51 = slechtste kwaliteit.<br>Gangbare waarden: 18 tot 28, standaard 23.<br>VP9 en AV1 gebruiken 0 tot 63, hogere waarden worden begrensd."
proc.ffmpegvideo.tooltip_field_bitrate = "Doelsnelheid in kbit/s, bijv. 2500 voor 720p.<br>Alleen geëvalueerd in bitratemodus."
proc.ffmpegvideo.tooltip_field_preset = "Afweging tussen verwerkingstijd en bestandsgrootte. Langzamer betekent kleiner bij dezelfde kwaliteit. De namen worden automatisch vertaald naar de schalen van VP9 en AV1."
proc.ffmpegvideo.tooltip_field_max_fps = "Bovengrens voor de framerate. Is de bron langzamer, dan blijft die ongewijzigd: frames worden nooit verzonnen."
proc.ffmpegvideo.tooltip_field_start_time = "De conversie begint op deze positie, bijv. 5 of 00:00:05"
proc.ffmpegvideo.tooltip_field_duration = "Lengte van het fragment vanaf de starttijd, bijv. 10 voor een voorbeeld van tien seconden. Leeg = tot het einde."
proc.ffmpegvideo.tooltip_field_faststart = "Verplaatst de index naar het begin van het bestand, zodat de video al kan beginnen af te spelen voordat hij volledig is geladen. Alleen werkzaam bij MP4."
proc.ffmpegvideo.tooltip_field_compatible_pix_mode = "Dwingt yuv420p af. Zonder deze optie leveren 10-bit- of 4:4:4-bronnen bestanden op die veel browsers en tv-toestellen niet kunnen afspelen."
proc.ffmpegvideo.tooltip_field_deinterlace = "Interlaced materiaal (bijv. van de omroep) toont anders kamstructuren bij beweging.<br>“Automatisch” past het filter alleen toe op frames die werkelijk zijn getroffen."
proc.ffmpegvideo.tooltip_field_auto_rotation = "Staande video’s van mobiele telefoons worden fysiek liggend opgeslagen en dragen de rotatie in hun metagegevens. Met deze optie uit blijft het beeld gekanteld."
proc.ffmpegvideo.tooltip_field_strip_meta = "Verwijdert alle metagegevens uit het doelbestand, in het bijzonder locatiegegevens en de apparaatnaam van opnamen met mobiele telefoons."
proc.ffmpegvideo.tooltip_field_audio_codec = "AAC past bij MP4, Opus bij WebM.<br>“Kopiëren” neemt de audiostream ongewijzigd over, zodat bitrate, kanalen en normalisatie geen effect hebben."
