proc.ffmpegvideo.tooltip_field_background_process = "Aanbevolen. Anders wacht het webverzoek tot de conversie klaar is en loopt het bij langere video’s tegen de tijdslimiet van PHP of de webserver aan.<br>De voortgang wordt bijgehouden door een cronjob (trigger_bg.php)."
