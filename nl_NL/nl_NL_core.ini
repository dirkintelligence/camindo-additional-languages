proc.ffmpegvideo.tooltip_field_audio_channels = "Het terugmixen van meerkanaalsaudio naar stereo of mono bespaart bitrate."
proc.ffmpegvideo.tooltip_field_audio_normalisation = "Stemt de luidheid af op -23 LUFS volgens EBU R128, zodat video’s met verschillende luidheid even luid worden afgespeeld. Kost extra verwerkingstijd."
