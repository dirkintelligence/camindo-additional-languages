proc.ffmpegaudio.tooltip_field_container = "De container bepaalt welke codecs zijn toegestaan:<br>MP3 alleen met MP3,<br>M4A alleen met AAC,<br>Ogg met Vorbis, Opus of FLAC,<br>Opus alleen met Opus,<br>FLAC en WAV zijn verliesvrij.<br>MP3 speelt overal af, M4A en Opus klinken bij dezelfde bestandsgrootte duidelijk beter."
proc.ffmpegaudio.tooltip_field_codec = "“Passend bij de container” kiest de standaardcodec van de gekozen container. Een codec die niet bij de container past, wordt bij het opslaan teruggezet naar die standaard.<br>“Kopiëren” neemt de audiostream ongewijzigd over: zeer snel, maar kwaliteit, samplefrequentie, kanalen, luidheid en faden hebben dan geen effect."
proc.ffmpegaudio.tooltip_field_quality_mode = "VBR houdt de kwaliteit constant en laat de bestandsgrootte meebewegen.<br>Bitrate houdt de grootte constant en laat de kwaliteit meebewegen. Voor het web is VBR meestal de betere keuze."
proc.ffmpegaudio.tooltip_field_quality = "0 = beste kwaliteit, 9 = kleinste bestand. Gangbare waarden: 2 tot 5, standaard 4 (ongeveer 160 kbit/s bij MP3).<br>Elke encoder heeft een eigen schaal en het niveau wordt automatisch vertaald: MP3 en Vorbis hebben echte kwaliteitsniveaus, AAC en Opus krijgen een passende doelbitrate.<br>Bij FLAC bepaalt het niveau hoe sterk de gegevens worden ingepakt, de kwaliteit blijft verliesvrij."
proc.ffmpegaudio.tooltip_field_bitrate = "Doelsnelheid in kbit/s, bijv. 128 voor muziek in stereo, 96 voor spraak, 64 voor mono.<br>Alleen geëvalueerd in bitratemodus en zonder effect bij FLAC en PCM."
proc.ffmpegaudio.tooltip_field_sample_rate = "Samplefrequentie van het doelbestand. 44,1 kHz is de frequentie van de audio-cd, 48 kHz die van video en omroep. Voor alleen spraak volstaan 22,05 of 16 kHz en dat bespaart veel ruimte.<br>Opus werkt intern altijd met 48 kHz."
proc.ffmpegaudio.tooltip_field_audio_channels = "Het terugmixen van meerkanaals- of stereoaudio naar mono halveert de bestandsgrootte van spraakopnamen bijna."
proc.ffmpegaudio.tooltip_field_normalisation = "Stemt de luidheid af volgens EBU R128, zodat opnamen met verschillende luidheid even luid worden afgespeeld.<br>-23 LUFS is de omroepstandaard, -16 LUFS is gangbaar op het web en voor podcasts.<br>Meten en corrigeren gebeuren in één doorloop: iets minder nauwkeurig dan twee doorlopen, maar zonder extra verwerkingstijd."
proc.ffmpegaudio.tooltip_field_gain = "Verhoogt of verlaagt het niveau met de opgegeven waarde in decibel. In combinatie met normalisatie werkt de waarde als verschuiving ten opzichte van het doel ervan.<br>Let op: verhogen kan clipping veroorzaken."
proc.ffmpegaudio.tooltip_field_start_time = "De conversie begint op deze positie, bijv. 5 of 00:00:05"
proc.ffmpegaudio.tooltip_field_duration = "Lengte van het fragment vanaf de starttijd, bijv. 30 voor een voorbeeld van een halve minuut. Leeg = tot het einde."
proc.ffmpegaudio.tooltip_field_fade_in = "Laat het begin infaden over de opgegeven tijd in seconden, bijv. 2 of 1,5. Haalt de scherpte uit abrupte beginnen."
proc.ffmpegaudio.tooltip_field_fade_out = "Laat het einde uitfaden over de opgegeven tijd in seconden. Het startpunt wordt berekend uit de duur van het doelbestand en houdt dus rekening met starttijd en lengte.<br>Is de duur van de bron onbekend, dan wordt er niets uitgefaded."
proc.ffmpegaudio.tooltip_field_strip_meta = "Verwijdert alle metagegevens uit het doelbestand, inclusief titel, artiest en album. Bij audio meestal ongewenst, maar nuttig bijv. bij spraakopnamen met een apparaatnaam en een locatie."
proc.ffmpegaudio.tooltip_field_keep_cover = "Behoudt een in het bronbestand ingesloten hoesafbeelding. Alleen werkzaam bij MP3, M4A en FLAC.<br>Bevat de bron in plaats van een hoesafbeelding een echte videostream, dan wordt die altijd verworpen: de audio blijft."
proc.ffmpegaudio.tooltip_field_threads = "Aantal kernen dat ffmpeg mag gebruiken. Leeg laten om ffmpeg te laten beslissen. De meeste audio-encoders draaien toch op één kern."
proc.ffmpegaudio.tooltip_field_background_process = "Bij audio meestal niet nodig. Bij zeer lange opnamen (preken, concerten, luisterboeken) voorkomt de achtergrondmodus dat het webverzoek tegen de tijdslimiet van PHP of de webserver aanloopt.<br>De voortgang wordt bijgehouden door een cronjob (trigger_bg.php)."
proc.ffmpegaudio.tooltip_field_max_time_out = "De conversie wordt na deze tijd afgebroken. Voorkomt dat een defect bestand onbeperkt verwerkingstijd bezet."
proc.ffmpegaudio.tooltip_field_parameter1 = "Invoeropties die vóór het bronbestand worden geplaatst,<br>bijv. -guess_layout_max 0"
proc.ffmpegaudio.tooltip_field_parameter2 = "Eigen uitvoeropties, bijv. -cutoff 18000.<br>Wordt hier een optie opgegeven die een van de velden hierboven vervangt (bijv. -b:a of -af), dan wint de eigen waarde en wordt het bijbehorende veld genegeerd. Alle andere velden blijven van kracht."
